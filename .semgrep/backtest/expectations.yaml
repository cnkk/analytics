# What each pull request is expected to prove about the ruleset.
#
#   detects: rules that must fire on the PR's own changed files before the fix,
#            and whose finding count on those files must drop after it
#   silent:  rules that must not fire on the PR's changed files in either tree
#
# The `silent` lists are the interesting half. Each of these PRs fixes exactly
# one vulnerability class, so every rule aimed at a different class has to stay
# quiet on the same files. That is what stops a rule from being widened until it
# matches everything and still "passes".
#
# `head` is the PR's head commit. The harness reverse-applies the PR's own diff
# onto it to reconstruct the vulnerable tree.

prs:
