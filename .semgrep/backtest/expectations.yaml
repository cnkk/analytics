    title: Escape team name in CRM
    head: 874dbf834278410d85226938e43b27092e2fbdfb
    detects:
      - plausible-elixir-html-interpolation
    silent:
      - plausible-ecto-cast-tenant-key
      - plausible-ecto-cast-foreign-key
      - plausible-ecto-cast-capability-token
      - plausible-repo-lookup-missing-tenant-scope
      - plausible-oauth-state-unsigned
